name: attachmates
description: A dating app with onboarding, authentication, chat, and SafeMatch verification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── UI ───────────────────────────────────────────
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.2
  photo_view: ^0.14.0

  # ─── Firebase (core, auth, database, storage, messaging) ─────────────────────
  firebase_core: ^2.31.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.5
  firebase_database: ^10.4.0
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4

  # ─── Auth providers ────────────────────────────────────────────────
  google_sign_in: ^6.1.6
  flutter_facebook_auth: ^6.0.4

  # ─── Media capture / processing ────────────────────────────────────
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  flutter_image_compress: ^2.3.0

  # ─── Audio & permissions ───────────────────────────────────────────
  flutter_sound: ^9.2.13
  just_audio: ^0.9.38
  permission_handler: ^11.3.1

  # ─── Networking & utilities ────────────────────────────────────────
  http: ^1.1.0
  http_parser: ^4.0.2
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  mime: ^1.0.4
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.5

  # ─── Backend & env ────────────────────────────────────────────────
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.1.0

  # ─── State management ─────────────────────────────────────────────
  provider: ^6.1.2

  # ─── Notifications ──────────────────────────────────────────
  flutter_local_notifications: ^17.2.1
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/
    - .env
    - assets/icons/

# ─── Splash screen ────────────────────────────────────────────────
flutter_native_splash:
  color: "#ffffff"
  image: "assets/attachmates_logo1.png"
  branding: "assets/attachmates_branding.png"
  branding_mode: bottom
  fullscreen: true

# ─── Android 12+ splash variant ───────────────────────────────────
android_12:
  image: "assets/attachmates_logo_android_12.png"
  branding: "assets/attachmates_branding_android_12.png"
  icon_background_color: "#FFFFFF"
  branding_mode: bottom

# ─── Launcher icons ───────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/attachmates_logo1.png"
